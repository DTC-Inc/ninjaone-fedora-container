name: Tagged release (v*)

# Manual hotfix path — pushing a v* tag triggers a fresh build and creates a
# GitHub Release. Normal releases flow through PR promotion in promote.yml.

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract semver from tag
        id: vars
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          IMAGE=$(printf '%s' "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "major=${MAJOR}"
            echo "minor=${MINOR}"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Stage no-agent build context
        run: |
          mkdir -p build-ctx
          cp docker/Containerfile docker/ninjarmm-bootstrap.sh \
             docker/ninjarmm-bootstrap.service docker/in-host build-ctx/
          : > build-ctx/agent.rpm

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build-ctx
          file: build-ctx/Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.minor }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.major }}
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:release
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          body: |
            Container image:
            - `${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}` (pinned)
            - `${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.minor }}` (rolling within minor)
            - `${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.major }}` (rolling within major)
            - `${{ steps.vars.outputs.image }}:latest` (rolling — not for production)
