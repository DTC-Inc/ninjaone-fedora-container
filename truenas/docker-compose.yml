services:
  ninjarmm-agent:
    image: ghcr.io/dtc-inc/ninjaone-fedora-container:latest

    # The agent auto-detects the host's hostname at boot (ninjarmm-hostname.service
    # mirrors /host/etc/hostname), so it checks into NinjaOne as the box on any
    # host -- NINJA_HOSTNAME is OPTIONAL. If set it also names the docker container
    # (nicer `docker ps`); otherwise the container is just "ninjarmm-agent".
    container_name: ${NINJA_HOSTNAME:-ninjarmm-agent}
    hostname: ${NINJA_HOSTNAME:-ninjarmm-agent}
    restart: always

    # Host networking, matching the podman quadlet's Network=host: the agent
    # reports the host's real interfaces/IPs and checks in over the host stack,
    # and there's no container-side DNS to misconfigure (the image masks
    # systemd-resolved so name resolution defers to the host). On TrueNAS SCALE,
    # set the Custom App's network mode to "Host".
    network_mode: host

    # systemd runs as PID 1 inside the container so the agent installs and
    # supervises its own services -- ninjarmm-agent, the patcher timer, and the
    # Lockhart backup daemon (com.ninjarmm.lockhartd.service). SIGRTMIN+3 is
    # systemd's clean-shutdown signal.
    stop_signal: SIGRTMIN+3
    stop_grace_period: 90s
    privileged: true
    cap_add:
      - SYS_ADMIN

    environment:
      # Helps systemd detect it's containerized.
      - container=docker
      # Public download link for the token-stamped NinjaOne Linux agent RPM
      # (console -> Add Devices -> Linux). Installed on first boot if the
      # ninjarmm-agent volume is empty. Leave unset if the image baked an RPM.
      - NINJA_AGENT_URL=${NINJA_AGENT_URL:-}

    # systemd needs writable /run and /tmp.
    tmpfs:
      - /run
      - /run/lock
      - /tmp

    volumes:
      # cgroup hierarchy for systemd (cgroup v2).
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

      # Agent install + identity + runtime data + logs persist here. With the
      # agent now in the container's own namespace, a plain volume at the
      # canonical path is all it needs -- no bind/nsenter handoff.
      - ninjarmm-agent:/opt/NinjaRMMAgent

      # Hardware visibility for SMART / sensors / inventory.
      - /dev:/dev

      # FULL host access, established only while the container runs (nothing is
      # written to the host; it's gone on uninstall). Host / is bind-mounted
      # READ-WRITE at /host, recursively (rslave: host mounts propagate in,
      # container mounts never leak back). This lets the remote terminal, in-host,
      # scripts, the NinjaOne file browser, AND Lockhart back up / modify the whole
      # host -- target any host path as /host/<path>. On ostree/atomic hosts
      # /host/usr stays read-only because it is read-only on the host itself.
      # /proc is pinned read-only at /host/proc for the in-host handoff
      # (/host/proc/1/ns/*). Back up any host path -- including pools -- under
      # /host (e.g. /host/mnt/<pool>/<dataset>).
      - /:/host:rw,rslave
      - /proc:/host/proc:ro,rslave

      # Report the HOST's OS to NinjaOne, not the container's Fedora. The agent
      # reads /etc/os-release verbatim; mounting the host's over the container's
      # makes the device show up as its real OS (Bazzite, TrueNAS SCALE, ...).
      # Bound at /usr/lib/os-release because /etc/os-release symlinks to it. dnf's
      # $releasever is pinned in the image so this doesn't break the agent install.
      - /etc/os-release:/usr/lib/os-release:ro

volumes:
  ninjarmm-agent:
    name: ninjarmm-agent
